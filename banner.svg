<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="indigoGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="amberGlow" cx="50%" cy="100%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4" />
    </linearGradient>
    
    <!-- Filter for soft glows -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25" />
      <circle cx="0" cy="0" r="1" fill="#6366f1" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      font-weight: 800;
      font-size: 40px;
      letter-spacing: -0.5px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .sub-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      font-weight: 400;
      font-size: 15px;
    }
    .tag-text {
      font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      font-weight: 500;
      font-size: 12px;
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Overlay -->
  <rect width="900" height="240" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="160" cy="70" r="140" fill="url(#indigoGlow)" filter="url(#blurFilter)" />
  <circle cx="750" cy="160" r="150" fill="url(#cyanGlow)" filter="url(#blurFilter)" />
  <circle cx="450" cy="220" r="120" fill="url(#amberGlow)" filter="url(#blurFilter)" />

  <!-- Top Decorative Border Accent -->
  <rect x="0" y="0" width="900" height="3" fill="url(#accentGrad)" />

  <!-- Flowing Bottom Wave Elements -->
  <path d="M 0 215 C 180 190, 320 235, 520 205 C 680 180, 800 225, 900 200 L 900 240 L 0 240 Z" fill="url(#waveGrad)" />
  <path d="M 0 225 C 220 205, 400 235, 620 215 C 760 200, 840 230, 900 220 L 900 240 L 0 240 Z" fill="#0b0f19" fill-opacity="0.7" />

  <!-- Status Pill Badge -->
  <g transform="translate(60, 38)">
    <rect width="265" height="26" rx="13" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#10b981" />
    <circle cx="14" cy="13" r="7" fill="#10b981" fill-opacity="0.25" />
    <text x="28" y="17" fill="#a5b4fc" class="badge-text">FULL STACK SOFTWARE ENGINEER</text>
  </g>

  <!-- Name Title -->
  <text x="60" y="112" fill="url(#nameGrad)" class="title-text">Sudhananda Biswas</text>
  
  <!-- Subtitle / Role Focus -->
  <text x="60" y="145" fill="#94a3b8" class="sub-text">
    Specializing in <tspan fill="#38bdf8" font-weight="600">.NET Core</tspan>, <tspan fill="#818cf8" font-weight="600">Angular &amp; React</tspan>, <tspan fill="#f59e0b" font-weight="600">MS SQL Server</tspan>, &amp; <tspan fill="#2dd4bf" font-weight="600">Microservices</tspan>
  </text>

  <!-- Tech Tags / Highlights -->
  <g transform="translate(60, 168)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="85" height="24" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="42" y="16" fill="#cbd5e1" class="tag-text" text-anchor="middle">C# / .NET</text>

    <!-- Tag 2 -->
    <rect x="95" y="0" width="75" height="24" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="132" y="16" fill="#cbd5e1" class="tag-text" text-anchor="middle">Angular</text>

    <!-- Tag 3 -->
    <rect x="180" y="0" width="75" height="24" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="217" y="16" fill="#cbd5e1" class="tag-text" text-anchor="middle">Next.js</text>

    <!-- Tag 4 -->
    <rect x="265" y="0" width="95" height="24" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="312" y="16" fill="#cbd5e1" class="tag-text" text-anchor="middle">SQL Server</text>

    <!-- Tag 5 -->
    <rect x="370" y="0" width="115" height="24" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="427" y="16" fill="#cbd5e1" class="tag-text" text-anchor="middle">Microservices</text>

    <!-- Tag 6 -->
    <rect x="495" y="0" width="75" height="24" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="532" y="16" fill="#cbd5e1" class="tag-text" text-anchor="middle">Docker</text>
  </g>

  <!-- Right Decorative Geometric Brand Box -->
  <g transform="translate(730, 48)">
    <rect width="110" height="110" rx="18" fill="#1e293b" fill-opacity="0.4" stroke="#475569" stroke-width="1" stroke-opacity="0.5" />
    <rect x="12" y="12" width="86" height="86" rx="12" fill="#6366f1" fill-opacity="0.08" stroke="url(#accentGrad)" stroke-width="1.5" />
    
    <!-- Code Bracket Symbol -->
    <path d="M 46 42 L 32 55 L 46 68" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 64 42 L 78 55 L 64 68" fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 58 38 L 52 72" fill="none" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" />

    <text x="55" y="88" fill="#94a3b8" font-family="'SF Mono', Consolas, monospace" font-size="9" text-anchor="middle">madcoder</text>
  </g>

  <!-- Outer Border -->
  <rect width="900" height="240" rx="16" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.4" />
</svg>
